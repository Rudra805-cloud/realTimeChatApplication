<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat App</title>
  </head>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0f172a;
      color: white;
      display: flex;
      height: 100vh;
    }

    #user-list {
      width: 250px;
      background: #1e293b;
      padding: 20px;
      border-right: 1px solid #334155;
    }

    #user-list h3 {
      margin-bottom: 15px;
    }

    #users li {
      list-style: none;
      padding: 8px 0;
    }

    #chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    #chat div {
      background: #1e293b;
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 10px;
      width: fit-content;
      max-width: 70%;
    }

    #message-form {
      display: flex;
      padding: 15px;
      background: #1e293b;
      border-top: 1px solid #334155;
    }

    #message-input {
      flex: 1;
      padding: 12px;
      border: none;
      outline: none;
      border-radius: 8px;
      background: #334155;
      color: white;
    }

    button {
      margin-left: 10px;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }
  </style>
  <body>
    <div id="user-list">
      <h3>Online Users</h3>
      <ul id="users"></ul>
    </div>

    <div id="chat-container">
      <div id="chat"></div>

      <form id="message-form">
        <input
          type="text"
          id="message-input"
          placeholder="Enter your message"
          required
        />

        <button type="submit">Send</button>
      </form>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io();
      const chat = document.getElementById("chat");
      const usersList = document.getElementById("users");
      const messageForm = document.getElementById("message-form");
      const messageInput = document.getElementById("message-input");

      let username = prompt("Enter your username");

      while (!username || username.trim() === "") {
        username = prompt("Username is required");
      }

      username = username.trim();

      socket.emit("join", username);

      socket.on("userJoined", (user) => {
        addMessage(`${user} has joined the chat`);
      });

      //handel user left

      socket.on("userLeft", (user) => {
        addMessage(`${user} has left the chat`);
      });

      socket.on("userList", (users) => {
        usersList.innerHTML = users.map((user) => `<li>${user}</li>`).join("");
      });
      //listen the chat massage event from the server

      socket.on("chatMessage", (message) => {
        addMessage(`${message.username}:${message.text}`);
      });

      messageForm.addEventListener("submit", (event) => {
        event.preventDefault();

        const exactMessageText = messageInput.value.trim();
        if (exactMessageText) {
          socket.emit("chatMessage", {
            username,
            text: exactMessageText,
          });
          messageInput.value = "";
        }
      });
      function addMessage(input) {
        const messageElement = document.createElement("div");
        messageElement.textContent = input;
        chat.appendChild(messageElement);

        //scroll to the bottom of the chat container
        chat.scrollTop = chat.scrollHeight;
      }
    </script>
  </body>
</html>
