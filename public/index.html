<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat App</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        background: #0f172a;
        color: white;
        display: block;
        height: 100vh;
      }

      #join-screen {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        gap: 10px;
      }

      #join-screen input {
        padding: 12px;
        border-radius: 8px;
        border: none;
        outline: none;
        width: 250px;
      }

      #user-list {
        width: 250px;
        background: #1e293b;
        padding: 20px;
        border-right: 1px solid #334155;
        height: 100vh;
      }

      #users li {
        list-style: none;
        padding: 8px 0;
      }

      #chat-container {
        flex: 1;
        display: none;
        flex-direction: column;
        height: 100vh;
      }

      #chat {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
      }

      #chat div {
        background: #1e293b;
        padding: 10px 14px;
        border-radius: 10px;
        margin-bottom: 10px;
        width: fit-content;
        max-width: 70%;
      }

      #message-form {
        display: flex;
        padding: 15px;
        background: #1e293b;
        border-top: 1px solid #334155;
      }

      #message-input {
        flex: 1;
        padding: 12px;
        border: none;
        outline: none;
        border-radius: 8px;
        background: #334155;
        color: white;
      }

      button {
        margin-left: 10px;
        padding: 12px 20px;
        border: none;
        border-radius: 8px;
        background: #2563eb;
        color: white;
        cursor: pointer;
      }

      button:hover {
        background: #1d4ed8;
      }

      #app {
        display: flex;
      }

      #user-list {
        display: none;
      }
    </style>
  </head>

  <body>
    <!-- JOIN SCREEN -->
    <div id="join-screen">
      <h2>Join Chat</h2>
      <input type="text" id="username-input" placeholder="Enter username" />
      <button id="join-btn">Join Chat</button>
    </div>

    <!-- APP -->
    <div id="app">
      <div id="user-list">
        <h3>Online Users</h3>
        <ul id="users"></ul>
      </div>

      <div id="chat-container">
        <div id="chat"></div>

        <form id="message-form">
          <input
            type="text"
            id="message-input"
            placeholder="Enter your message"
            required
          />
          <button type="submit">Send</button>
        </form>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>

    <script>
      const socket = io();
      const chat = document.getElementById("chat");
      const usersList = document.getElementById("users");
      const messageForm = document.getElementById("message-form");
      const messageInput = document.getElementById("message-input");

      const joinBtn = document.getElementById("join-btn");
      const usernameInput = document.getElementById("username-input");

      let username = "";
      let isLoggedIn = false;

      // JOIN CHAT
      joinBtn.addEventListener("click", () => {
        const enteredUsername = usernameInput.value.trim();
        const usernameRegex = /^[a-zA-Z0-9_]+$/;
        if (!enteredUsername) {
          alert("enter a user name");
          return;
        }
        if (enteredUsername.length > 15) {
          alert("Username cannot exceed 15 characters");
          return;
        }
        if (!usernameRegex.test(enteredUsername)) {
          alert("Username can only contain letters, numbers, and underscores");
          return;
        }
        username = enteredUsername;
        isLoggedIn = true;
        socket.emit("join", username);
      });
      socket.on("joinSuccess", () => {
        isLoggedIn = true;

        document.getElementById("join-screen").style.display = "none";
        document.getElementById("chat-container").style.display = "flex";
        document.getElementById("user-list").style.display = "block";
      });
      //user name check
      socket.on("errorMessage", (message) => {
        alert(message);

        // IMPORTANT: reset state
        isLoggedIn = false;
        username = "";
      });
      // USER JOINED
      socket.on("userJoined", (user) => {
        addMessage(`${user} has joined the chat`);
      });

      // USER LEFT
      socket.on("userLeft", (user) => {
        if (!user) {
          return;
        }
        addMessage(`${user} has left the chat`);
      });

      // USER LIST
      socket.on("userList", (users) => {
        if (!usersList) return;
        usersList.innerHTML = "";

        users.forEach((user) => {
          const li = document.createElement("li");
          li.textContent = user;
          usersList.appendChild(li);
        });
      });

      // RECEIVE MESSAGE
      socket.on("chatMessage", (message) => {
        addMessage(`${message.username}: ${message.text}`);
      });

      // SEND MESSAGE
      messageForm.addEventListener("submit", (event) => {
        event.preventDefault();

        if (!isLoggedIn) {
          alert("Please join chat first");
          return;
        }

        const text = messageInput.value.trim();

        if (text) {
          socket.emit("chatMessage", {
            username,
            text,
          });

          messageInput.value = "";
        }
      });

      // ADD MESSAGE TO CHAT
      function addMessage(text) {
        const div = document.createElement("div");
        div.textContent = text;

        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
      }
    </script>
  </body>
</html>
